services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: baili-electronics
    restart: unless-stopped
    command:
    - python
    - -c
    - from backend.server import main; main()
    ports:
    - 43210:43210
    env_file:
    - ../.env
    volumes:
    - ../data:/app/data
    - /data/niuma_modules_extracted:/niuma_modules:ro
    environment:
    - MCU_HOST=0.0.0.0
    - MCU_PORT=43210
    - MCU_LIB_BASE=/niuma_modules
    - PYTHONPATH=/app/backend
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:43210/api/health
      interval: 30s
      timeout: 5s
      retries: 3
